<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Start Page</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      /* ✅ FIXED — Works on GitHub */
      background: url('am.jpg') no-repeat center center fixed;
      background-size: cover;

      font-family: 'Arial', sans-serif;
      color: #fff;
      overflow: hidden;
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 50px;
      margin: 10px 0;
      color: #ff4d4d;
      font-family: "Arial Rounded MT Bold", "Arial", sans-serif;
      text-shadow: 0 0 5px #ff4d4d, 0 0 10px #ff1a1a;
    }

    h2 {
      font-size: 20px;
      margin: 5px 0;
      font-weight: normal;
      color: #a0a0a0;
    }

    p {
      font-size: 28px;
      margin: 5px 0;
    }

    .highlight {
      font-size: 36px;
      margin: 15px 0;
      color: #00f0ff;
    }

    button {
      padding: 25px 50px;
      font-size: 26px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #00f0ff, #1f2833);
      border: 2px solid #00f0ff;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 0 20px #00f0ff, 0 0 40px #00f0ff inset;
      transition: all 0.3s ease;
      margin-top: 30px;
    }

    button:hover {
      transform: scale(1.15);
      box-shadow: 0 0 30px #00f0ff, 0 0 50px #00f0ff inset;
    }
  </style>
</head>
<body>
  <h1>NASA Space Apps Hackers</h1>
  <h2>Team...</h2>
  <p>Insane Yodha</p>
  <div class="highlight">Let's Begin with NASAHACKS</div>
  <button onclick="window.location.href='startt.html'">Begin</button>
</body>
</html>
