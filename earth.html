<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Earth - Planet Info</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('plaa.jpg'); /* Make sure plaa.jpg is in the same folder */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #fff;
      text-align: center;
      padding: 30px;
      margin: 0;
    }

    img {
      width: 250px;
      height: 250px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
      margin-bottom: 20px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.9);
    }

    h1 {
      color: #2ecc71;
      font-size: 40px;
      text-shadow: 0 0 15px #00ffcc;
    }

    p {
      max-width: 700px;
      margin: auto;
      line-height: 1.6;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.4);
      padding: 15px 25px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #3498db;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    a:hover {
      background: #217dbb;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Earth</h1>
  <img src="earth.png" alt="Earth"> <!-- Make sure earth.png is in the same folder -->
  <p>
    Earth is our home planet and the only known world to support life. 
    About 71% of its surface is covered in water, and it has a breathable atmosphere that sustains millions of species. 
    A year on Earth is 365 days, and it takes 24 hours to rotate once.
  </p>
  <a href="index.html">⬅ Back to Planet Selector</a>
</body>
</html>
