<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🌌 Smart Planet Selector</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto:wght@400;700&display=swap');

    body {
      font-family: 'Roboto', sans-serif;
      text-align: center;
      padding: 40px;

      /* ✅ FIXED BACKGROUND — now loads from GitHub repo */
      background: url('gal.webp') no-repeat center center fixed;
      background-size: cover;

      color: #e6f2ff;
      overflow-x: hidden;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3em;
      color: #ffffff;
      text-shadow: 0 0 15px #00d4ff, 0 0 30px #0044cc;
      margin-bottom: 15px;
    }

    p.subtitle {
      font-size: 18px;
      color: #b3d9ff;
      margin-bottom: 40px;
      text-shadow: 0 0 8px #000;
    }

    .scroll-wrapper {
      position: relative;
      max-width: 100vw;
      margin: 0 auto 60px auto;
    }

    .cards {
      display: flex;
      gap: 24px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
    }

    .cards::-webkit-scrollbar {
      display: none;
    }

    .card {
      flex: 0 0 auto;
      cursor: pointer;
      width: 168px;
      background: rgba(0, 0, 20, 0.6);
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 200, 255, 0.2);
      padding: 14px;
      transition: transform 0.3s, box-shadow 0.3s;
      color: #fff;
      text-align: center;
    }

    .card:hover {
      transform: scale(1.08);
      box-shadow: 0 0 28px #00d4ff;
      z-index: 10;
    }

    .card img {
      width: 100%;
      height: 147px;
      object-fit: cover;
      margin-bottom: 10px;
      border-radius: 12px;
      border: none;
      box-shadow: none;
    }

    .card h2 {
      margin: 0;
      font-size: 18px;
      font-family: 'Orbitron', sans-serif;
      color: #e6faff;
      text-shadow: 0 0 5px #00d4ff;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      color: #fff;
      font-size: 28px;
      line-height: 40px;
      text-align: center;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      transition: background 0.25s;
    }

    .arrow:hover {
      background: rgba(0, 200, 255, 0.6);
    }

    .arrow-left {
      left: 5px;
    }

    .arrow-right {
      right: 5px;
    }

    footer {
      margin-top: 60px;
      color: #aaa;
      font-size: 14px;
      text-shadow: 0 0 5px #000;
    }
  </style>
</head>
<body>
  <h1>🌌 Smart Planet Selector</h1>
  <p class="subtitle">Click on a planet to explore detailed information</p>

  <div class="scroll-wrapper">
    <div class="arrow arrow-left" id="scroll-left">&#8249;</div>
    <div class="cards" id="planet-cards"></div>
    <div class="arrow arrow-right" id="scroll-right">&#8250;</div>
  </div>

  <footer><p>- Made By Insane Yodha 🧾 -</p></footer>

  <script>
    /*  
      🔥 FIXED — use relative image paths (GitHub-compatible)
      These files exist in your repo:
      mercury.png, venus.png, earth.png, mars.png, jupiter.png, saturn.png, uranus.png, neptune.png
    */

    const planets = [
      { name: "Mercury", img: "mercury.png" },
      { name: "Venus",   img: "venus.png" },
      { name: "Earth",   img: "earth.png" },
      { name: "Mars",    img: "mars.png" },
      { name: "Jupiter", img: "jupiter.png" },
      { name: "Saturn",  img: "saturn.png" },
      { name: "Uranus",  img: "uranus.png" },
      { name: "Neptune", img: "neptune.png" }
    ];

    const cardsContainer = document.getElementById('planet-cards');
    const scrollLeftBtn = document.getElementById('scroll-left');
    const scrollRightBtn = document.getElementById('scroll-right');

    planets.forEach((planet, index) => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <img src="${planet.img}" alt="${planet.name}" />
        <h2>${planet.name}</h2>
      `;

      card.addEventListener('click', () => {
        const planetName = planets[index].name.toLowerCase();
        window.open(`${planetName}.html`, '_blank');
      });

      cardsContainer.appendChild(card);
    });

    scrollLeftBtn.addEventListener('click', () =>
      cardsContainer.scrollBy({ left: -240, behavior: 'smooth' })
    );
    scrollRightBtn.addEventListener('click', () =>
      cardsContainer.scrollBy({ left: 240, behavior: 'smooth' })
    );
  </script>
</body>
</html>
