<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mercury - Planet Info</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('plaa.webp'); /* Same background for consistency */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #fff;
      text-align: center;
      padding: 30px;
      margin: 0;
    }

    img {
      width: 250px;
      height: 250px;
      border-radius: 50%; /* Circle planet */
      object-fit: cover;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6); /* Yellowish glow for Mercury */
      margin-bottom: 20px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.9);
    }

    h1 {
      color: #f1c40f;
      font-size: 40px;
      text-shadow: 
        0 0 10px #ffd700,
        0 0 20px #ffd700,
        0 0 30px #f1c40f,
        0 0 40px #f1c40f;
    }

    p {
      max-width: 700px;
      margin: auto;
      line-height: 1.6;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.4); /* Semi-transparent dark background */
      padding: 15px 25px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #3498db;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    a:hover {
      background: #217dbb;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Mercury</h1>
  <img src="mercury.png" alt="Mercury"> <!-- Local image, make sure it's in the same folder -->
  <p>
    Mercury is the closest planet to the Sun and the smallest in our Solar System. 
    It has almost no atmosphere, which means temperatures swing drastically between 
    day and night. A year on Mercury takes just 88 Earth days!
  </p>
  <a href="index.html">⬅ Back to Planet Selector</a>
</body>
</html>
