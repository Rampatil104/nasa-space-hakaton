<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neptune - Planet Info</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('plaa.webp'); /* Same background as other planets */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #fff;
      text-align: center;
      padding: 30px;
      margin: 0;
    }

    img {
      width: 250px;
      height: 250px;
      border-radius: 50%; /* Circle planet */
      object-fit: cover;
      box-shadow: 0 0 25px rgba(0, 128, 255, 0.6); /* Blue glow for Neptune */
      margin-bottom: 20px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(0, 128, 255, 0.9);
    }

    h1 {
      color: #2980b9;
      font-size: 40px;
      text-shadow:
        0 0 10px #3399ff,
        0 0 20px #3399ff,
        0 0 30px #2980b9,
        0 0 40px #2980b9;
    }

    p {
      max-width: 700px;
      margin: auto;
      line-height: 1.6;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.4); /* semi-transparent dark background */
      padding: 15px 25px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 128, 255, 0.2);
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #3498db;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    a:hover {
      background: #217dbb;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Neptune</h1>
  <img src="neptune.png" alt="Neptune"> <!-- Use local image in same folder -->
  <p>
    Neptune is the farthest planet from the Sun and is a deep blue ice giant. 
    It has supersonic winds and dark storms similar to Jupiter’s Great Red Spot. 
    Neptune also has 14 known moons, with Triton being the largest.
  </p>
  <a href="index.html">⬅ Back to Planet Selector</a>
</body>
</html>
